<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feast & Flavor | Menu & Contact</title>
    <style>
      /* --- General Reset & Variables --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      :root {
        --primary-color: #ff6b6b;
        --secondary-color: #2f3e46;
        --light-bg: #f8f9fa;
        --white: #ffffff;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        --border-radius: 8px;
      }
      body {
        background-color: var(--light-bg);
        color: var(--secondary-color);
        scroll-behavior: smooth;
      }

      /* --- Navigation Bar --- */
      header {
        background-color: var(--white);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary-color);
      }
      .nav-links {
        display: flex;
        list-style: none;
        gap: 30px;
      }
      .nav-links a {
        text-decoration: none;
        color: var(--secondary-color);
        font-weight: 600;
        transition: color 0.3s;
      }
      .nav-links a:hover {
        color: var(--primary-color);
      }
      .cart-badge {
        background-color: var(--primary-color);
        color: white;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 12px;
        margin-left: 5px;
      }

      /* --- Hero/Homepage Section --- */
      .hero {
        text-align: center;
        padding: 80px 20px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
          url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80");
        background-size: cover;
        background-position: center;
        color: white;
      }
      .hero h1 {
        font-size: 48px;
        margin-bottom: 10px;
      }

      /* --- Menu Section --- */
      .menu-section {
        max-width: 1200px;
        margin: 60px auto;
        padding: 0 20px;
      }
      .section-title {
        text-align: center;
        font-size: 36px;
        margin-bottom: 40px;
        position: relative;
      }
      .section-title::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background-color: var(--primary-color);
        margin: 10px auto 0;
      }
      .menu-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
      }
      .menu-box {
        background-color: var(--white);
        border-radius: var(--border-radius);
        padding: 25px;
        box-shadow: var(--shadow);
      }
      .menu-box h2 {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 20px;
        border-bottom: 2px solid var(--light-bg);
        padding-bottom: 10px;
      }
      .food-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px dashed #e0e0e0;
      }
      .food-info h4 {
        margin-bottom: 5px;
      }
      .food-info p {
        font-size: 14px;
        color: #666;
      }
      .food-price {
        font-weight: bold;
        color: var(--secondary-color);
        margin-right: 10px;
      }
      .add-btn {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: var(--border-radius);
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
      }
      .add-btn:hover {
        background-color: #ff4747;
      }

      /* --- Contact & About Sections --- */
      .about-section {
        background-color: var(--white);
        padding: 60px 20px;
        text-align: center;
      }
      .about-content {
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .contact-container {
        max-width: 1200px;
        margin: 60px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
      }
      .contact-form {
        background-color: var(--white);
        padding: 30px;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: var(--border-radius);
        font-size: 16px;
      }
      .submit-btn {
        background-color: var(--secondary-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: var(--border-radius);
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .submit-btn:hover {
        background-color: #1a2529;
      }

      .branches-box {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .branch-card {
        background-color: var(--white);
        padding: 20px;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        border-left: 5px solid var(--primary-color);
      }
      .branch-card.main-branch {
        border-left-color: #2b9348;
      }
      .branch-card h3 {
        margin-bottom: 5px;
      }

      /* --- Responsive Design --- */
      @media (max-width: 992px) {
        .menu-container,
        .contact-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Feast & Flavor</div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li>
            <a href="cart.html" style="color: var(--primary-color)"
              >Cart<span id="cart-count" class="cart-badge">0</span></a
            >
          </li>
        </ul>
      </nav>
    </header>

    <section id="homepage" class="hero">
      <h1>Welcome to Feast & Flavor</h1>
      <p>
        Delicious culinary experiences crafted with love and fresh ingredients.
      </p>
    </section>







    <script>
      function updateCartBadge() {
        const count = (JSON.parse(localStorage.getItem("restaurantCart")) || []).reduce((t, i) => t + i.quantity, 0);
        document.getElementById("cart-count").innerText = count;
      }
      updateCartBadge();
    </script>
  </body>
</html>
