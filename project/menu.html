<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feast &amp; Flavor | Menu</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
      :root { --primary-color: #ff6b6b; --secondary-color: #2f3e46; --light-bg: #f8f9fa; --white: #ffffff; --shadow: 0 4px 6px rgba(0,0,0,0.1); --border-radius: 8px; }
      body { background-color: var(--light-bg); color: var(--secondary-color); }
      header { background-color: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
      nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 20px; }
      .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); }
      .nav-links { display: flex; list-style: none; gap: 30px; }
      .nav-links a { text-decoration: none; color: var(--secondary-color); font-weight: 600; transition: color 0.3s; }
      .nav-links a:hover { color: var(--primary-color); }
      .cart-badge { background-color: var(--primary-color); color: white; padding: 2px 8px; border-radius: 20px; font-size: 12px; margin-left: 5px; }
      .menu-section { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
      .section-title { text-align: center; font-size: 36px; margin-bottom: 40px; position: relative; }
      .section-title::after { content: ""; display: block; width: 60px; height: 4px; background-color: var(--primary-color); margin: 10px auto 0; }
      .menu-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
      .menu-box { background-color: var(--white); border-radius: var(--border-radius); padding: 25px; box-shadow: var(--shadow); }
      .menu-box h2 { text-align: center; color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid var(--light-bg); padding-bottom: 10px; }
      .food-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #e0e0e0; }
      .food-info h4 { margin-bottom: 5px; }
      .food-info p { font-size: 14px; color: #666; }
      .food-price { font-weight: bold; color: var(--secondary-color); margin-right: 10px; }
      .add-btn { background-color: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; transition: background 0.3s; }
      .add-btn:hover { background-color: #ff4747; }
      @media (max-width: 992px) { .menu-container { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Feast &amp; Flavor</div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="cart.html" style="color: var(--primary-color)">Cart<span id="cart-count" class="cart-badge">0</span></a></li>
        </ul>
      </nav>
    </header>

    <section class="menu-section">
      <h2 class="section-title">Our Menu</h2>
      <div class="menu-container">
        <div class="menu-box"><h2>Breakfast</h2><div id="breakfast-items"></div></div>
        <div class="menu-box"><h2>Lunch</h2><div id="lunch-items"></div></div>
        <div class="menu-box"><h2>Dinner</h2><div id="dinner-items"></div></div>
      </div>
    </section>

    <script>
      const menuData = {
        breakfast: [
          { id: "b1", name: "Masala Dosa", price: 120, desc: "Crispy crepe with spiced potato filling and coconut chutney" },
          { id: "b2", name: "Idli Sambar", price: 80, desc: "Steamed rice cakes served with lentil soup and chutney" },
          { id: "b3", name: "Aloo Paratha", price: 100, desc: "Whole wheat flatbread stuffed with spiced mashed potato" },
          { id: "b4", name: "Poha", price: 70, desc: "Flattened rice with mustard seeds, turmeric and peanuts" },
          { id: "b5", name: "Upma", price: 75, desc: "Semolina porridge with mixed vegetables and cashews" },
          { id: "b6", name: "Medu Vada", price: 90, desc: "Crispy lentil doughnuts with coconut chutney and sambar" },
          { id: "b7", name: "Chole Bhature", price: 130, desc: "Spiced chickpea curry with fluffy deep-fried bread" },
          { id: "b8", name: "Puri Bhaji", price: 110, desc: "Fried puffed bread served with spiced potato curry" },
        ],
        lunch: [
          { id: "l1", name: "Butter Chicken", price: 280, desc: "Tender chicken in rich tomato-butter gravy, served with naan" },
          { id: "l2", name: "Hyderabadi Biryani", price: 320, desc: "Fragrant basmati rice slow-cooked with spiced chicken" },
          { id: "l3", name: "Dal Makhani", price: 220, desc: "Slow-cooked black lentils simmered overnight in creamy sauce" },
          { id: "l4", name: "Paneer Tikka Masala", price: 260, desc: "Grilled cottage cheese in bold spiced tomato gravy" },
          { id: "l5", name: "Rajma Chawal", price: 180, desc: "Red kidney bean curry served over steamed basmati rice" },
          { id: "l6", name: "Chicken Tikka", price: 300, desc: "Marinated chicken pieces grilled in a clay tandoor oven" },
          { id: "l7", name: "Veg Thali", price: 200, desc: "Assorted curries, dal, roti, rice, raita and pickle" },
          { id: "l8", name: "Sambar Rice", price: 160, desc: "Tangy lentil and vegetable stew ladled over steamed rice" },
        ],
        dinner: [
          { id: "d1", name: "Rogan Josh", price: 380, desc: "Slow-braised lamb in aromatic Kashmiri spices and yogurt" },
          { id: "d2", name: "Prawn Masala", price: 420, desc: "Tiger prawns cooked in spicy coconut-tomato gravy" },
          { id: "d3", name: "Palak Paneer", price: 260, desc: "Soft cottage cheese cubes in creamy spiced spinach gravy" },
          { id: "d4", name: "Mutton Biryani", price: 450, desc: "Slow-cooked mutton layered with fragrant saffron rice" },
          { id: "d5", name: "Tandoori Chicken", price: 350, desc: "Half chicken marinated in spiced yogurt, roasted in tandoor" },
          { id: "d6", name: "Goan Fish Curry", price: 380, desc: "Fresh catch simmered in tangy Goan coconut curry sauce" },
          { id: "d7", name: "Kadai Paneer", price: 280, desc: "Cottage cheese with bell peppers in bold kadai masala" },
          { id: "d8", name: "Garlic Naan + Dal Tadka", price: 200, desc: "Soft garlic flatbread with smoky tempered yellow dal" },
        ],
      };

      let cart = JSON.parse(localStorage.getItem("restaurantCart")) || [];

      function renderMenu() {
        ["breakfast", "lunch", "dinner"].forEach((category) => {
          const container = document.getElementById(`${category}-items`);
          container.innerHTML = "";
          menuData[category].forEach((item) => {
            container.innerHTML += `
              <div class="food-item">
                <div class="food-info">
                  <h4>${item.name}</h4>
                  <p>${item.desc}</p>
                </div>
                <div style="display: flex; align-items: center;">
                  <span class="food-price">&#8377;${item.price.toFixed(2)}</span>
                  <button class="add-btn" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">Add</button>
                </div>
              </div>`;
          });
        });
        updateCartBadge();
      }

      function addToCart(id, name, price) {
        const existingItem = cart.find((item) => item.id === id);
        if (existingItem) existingItem.quantity += 1;
        else cart.push({ id, name, price, quantity: 1 });
        localStorage.setItem("restaurantCart", JSON.stringify(cart));
        updateCartBadge();
      }

      function updateCartBadge() {
        const count = cart.reduce((total, item) => total + item.quantity, 0);
        document.getElementById("cart-count").innerText = count;
      }

      renderMenu();
    </script>
  </body>
</html>
